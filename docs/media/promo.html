<!doctype html>
<html lang="en">
<meta charset="utf-8">
<style>
  * { box-sizing: border-box; }
  body { margin: 0; width: 1200px; height: 630px; overflow: hidden; color: #f8f9fb; background: radial-gradient(circle at 85% 10%, #272622 0, #0b0d10 44%, #080a0e 100%); font: 16px system-ui, sans-serif; }
  .glow { position: absolute; inset: 0; background: radial-gradient(circle at 8% 95%, #f36c2130, transparent 45%); }
  .copy { position: absolute; z-index: 2; top: 48px; left: 58px; width: 570px; }
  .eyebrow { color: #ff8b45; font-size: 14px; font-weight: 800; letter-spacing: .2em; text-transform: uppercase; }
  h1 { margin: 22px 0 16px; font-size: 68px; line-height: .99; letter-spacing: -.065em; }
  p { margin: 0; max-width: 525px; color: #b5bbc6; font-size: 20px; line-height: 1.45; }
  .badges { display: flex; gap: 10px; margin-top: 32px; }
  .badges span { padding: 9px 14px; border: 1px solid #4a4f58; border-radius: 999px; color: #e8ebf0; font-size: 12px; font-weight: 700; letter-spacing: .05em; }
  .shot { position: absolute; border: 1px solid #4c4e53; border-radius: 13px; box-shadow: 0 24px 70px #000b; object-fit: cover; object-position: top left; }
  .back { top: 72px; left: 700px; width: 720px; height: 450px; opacity: .72; transform: rotate(8deg); }
  .front { top: 188px; left: 615px; width: 720px; height: 450px; transform: rotate(-4deg); }
  .footer { position: absolute; left: 58px; bottom: 38px; color: #ff8b45; font-size: 14px; font-weight: 700; letter-spacing: .07em; }
</style>
<div class="glow"></div>
<div class="copy">
  <div class="eyebrow">os-lab · security workbench</div>
  <h1>Explore. Test.<br>Understand.</h1>
  <p>Operating-system security labs, live workflows, and company firewall designs in one local dashboard.</p>
  <div class="badges"><span>Android</span><span>Windows</span><span>iOS</span><span>Linux</span><span>Firewall</span></div>
</div>
<img class="shot back" src="screenshots/android-overview.png" alt="">
<img class="shot front" src="screenshots/firewall-company.png" alt="">
<div class="footer">github.com/keyvanarasteh/os-lab</div>
</html>
